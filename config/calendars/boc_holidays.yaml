# Forward Bank of Canada holidays (amendment v1.3).
#
# Past business days come from the Bank's publication record (the Valet observation dates
# of FXUSDCAD, IEXE0101 and AVG.INTWO). This file only decides dates after the latest
# published date; once a date has passed, the record wins. Review disagreements with
# `himari data boc-calendar`.
#
# Rule (user decision, 2026-11-11; it matches the 2025 record): federal holidays plus
# Ontario's Family Day and Civic Holiday are closed; Quebec-only days and Easter Monday
# are open. A holiday on a weekend moves to the next free weekday (as the Bank's own
# schedule shows for Boxing Day 2026).

covered_years: [2026, 2027]

holidays:
  - {date: 2026-01-01, name: New Year's Day, basis: federal}
  - {date: 2026-02-16, name: Family Day, basis: Ontario}
  - {date: 2026-04-03, name: Good Friday, basis: federal}
  - {date: 2026-05-18, name: Victoria Day, basis: federal}
  - {date: 2026-07-01, name: Canada Day, basis: federal}
  - {date: 2026-08-03, name: Civic Holiday, basis: Ontario}
  - {date: 2026-09-07, name: Labour Day, basis: federal}
  - {date: 2026-09-30, name: National Day for Truth and Reconciliation, basis: federal}
  - {date: 2026-10-12, name: Thanksgiving, basis: federal}
  - {date: 2026-11-11, name: Remembrance Day, basis: federal,
     url: "https://www.bankofcanada.ca/press/upcoming-events/bank-of-canada-holiday-schedule/"}
  - {date: 2026-12-25, name: Christmas Day, basis: federal,
     url: "https://www.bankofcanada.ca/press/upcoming-events/bank-of-canada-holiday-schedule/"}
  - {date: 2026-12-28, name: Boxing Day (observed), basis: federal,
     url: "https://www.bankofcanada.ca/press/upcoming-events/bank-of-canada-holiday-schedule/"}
  - {date: 2027-01-01, name: New Year's Day, basis: federal}
  - {date: 2027-02-15, name: Family Day, basis: Ontario}
  - {date: 2027-03-26, name: Good Friday, basis: federal}
  - {date: 2027-05-24, name: Victoria Day, basis: federal}
  - {date: 2027-07-01, name: Canada Day, basis: federal}
  - {date: 2027-08-02, name: Civic Holiday, basis: Ontario}
  - {date: 2027-09-06, name: Labour Day, basis: federal}
  - {date: 2027-09-30, name: National Day for Truth and Reconciliation, basis: federal}
  - {date: 2027-10-11, name: Thanksgiving, basis: federal}
  - {date: 2027-11-11, name: Remembrance Day, basis: federal}
  - {date: 2027-12-27, name: Christmas Day (observed), basis: federal}
  - {date: 2027-12-28, name: Boxing Day (observed), basis: federal}
