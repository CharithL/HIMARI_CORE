[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "himari-core"
version = "0.1.0"
description = "HIMARI Core: rules-based multi-asset trend following system"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "pydantic>=2.5,<3",
    "pyarrow>=14,<18",
    "typer>=0.9,<1",
    "httpx>=0.25,<1",
    "exchange-calendars>=4.5,<5",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
broker = [
    "ib_async>=1.0.0",
]
research = [
    "statsmodels>=0.14,<1",
    "arch>=6,<8",
]
dashboard = [
    "streamlit>=1.28,<2",
    "plotly>=5.18,<6",
]
dev = [
    "pytest>=7.4,<9",
    "hypothesis>=6.88,<7",
    "pytest-cov>=4,<6",
    "ruff>=0.1,<1",
    "mypy>=1.7,<2",
    "types-PyYAML>=6",
    "pandas-stubs>=2.1",
]

[project.scripts]
himari = "himari.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/himari"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = [
    "B008",   # typer.Option in defaults is the documented pattern
    "TC003",  # Path/date needed at runtime, not just type-checking
    "UP042",  # str+Enum is more portable than StrEnum for pydantic serialization
    "UP017",  # timezone.utc is clearer than UTC alias
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N806", "B905"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["himari.core", "himari.risk", "himari.strategy", "himari.execution"]

[[tool.mypy.overrides]]
module = ["exchange_calendars.*", "ib_async.*", "ibapi.*", "arch.*", "typer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "golden: golden-file determinism tests",
    "property: hypothesis property tests",
    "crisis: crisis replay tests (need real data)",
    "integration: integration tests",
    "slow: slow tests",
]
